name: Build

# Every push to main builds Plots.exe and publishes it as a GitHub Release
# named after the VERSION file (e.g. v0.2.2, marked "Latest").
# Pull requests just build and test.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # always the newest 1.26 patch release, so standard-library security fixes are picked up
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet (Windows build)
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          # Win32/COM code intentionally uses unkeyed GUID literals and uintptr<->pointer casts
          out=$(go vet ./... 2>&1 | grep -v -e "unkeyed fields" -e "possible misuse of unsafe.Pointer" -e "^#" || true)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: Version
        id: ver
        run: |
          # The version comes from the VERSION file (e.g. 0.2.2).
          # If that release already exists, use the next free patch number
          # so a push never fails; bump VERSION yourself for planned releases.
          base=$(tr -d ' \r\n' < VERSION)
          mm=${base%.*}; p=${base##*.}
          while git ls-remote --exit-code --tags origin "refs/tags/v$mm.$p" >/dev/null 2>&1; do p=$((p+1)); done
          v="$mm.$p"
          if [ "${{ github.event_name }}" = "pull_request" ]; then v="$v-pr.${{ github.run_number }}"; fi
          if [ "$v" != "$base" ]; then echo "::notice::VERSION says $base but it is already released; building $v"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build Plots.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w -H windowsgui -X main.version=${{ steps.ver.outputs.version }}" \
            -o dist/Plots.exe .
          cp dist/Plots.exe dist/Plots-update.exe

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: Plots-v${{ steps.ver.outputs.version }}
          path: dist/*.exe
          retention-days: 30

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh is preinstalled on GitHub runners (no Node-based action needed)
          gh release create "v${{ steps.ver.outputs.version }}" \
            dist/Plots.exe dist/Plots-update.exe \
            --title "Plots v${{ steps.ver.outputs.version }}" \
            --target "${{ github.sha }}" \
            --generate-notes \
            --latest
