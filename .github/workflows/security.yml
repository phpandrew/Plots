name: Security

# govulncheck: known vulnerabilities in Go modules and the Go standard library
#              that Plots actually calls.
# CodeQL:      static analysis of the source (results under Security › Code scanning).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays, so new advisories are caught without a push
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: govulncheck (Windows build)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # scan as the Windows build so the *_windows.go files are included
          GOOS=windows GOARCH=amd64 "$(go env GOPATH)/bin/govulncheck" ./...

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual
      - name: Build (Windows target, traced by CodeQL)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build ./...
      - uses: github/codeql-action/analyze@v4
