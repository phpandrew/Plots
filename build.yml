name: Build

# Every push to main builds Plots.exe and publishes it as a GitHub Release
# (v0.2.<run number>, marked "Latest"). Pull requests just build and test.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet (Windows build)
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          # Win32/COM code intentionally uses unkeyed GUID literals and uintptr<->pointer casts
          out=$(go vet ./... 2>&1 | grep -v -e "unkeyed fields" -e "possible misuse of unsafe.Pointer" -e "^#" || true)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: Version
        id: ver
        run: echo "version=0.2.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build Plots.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w -H windowsgui -X main.version=${{ steps.ver.outputs.version }}" \
            -o dist/Plots.exe .
          cp dist/Plots.exe dist/Plots-update.exe

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Plots-v${{ steps.ver.outputs.version }}
          path: dist/*.exe
          retention-days: 30

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Plots v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist/Plots.exe
            dist/Plots-update.exe
